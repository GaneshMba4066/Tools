<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini Job Co-Pilot</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: #151d2e;
      --input-bg: #1e293b;
      --border: #334155;
      --primary: #38bdf8;
      --primary-hover: #0ea5e9;
      --accent: #10b981;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --error: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 380px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      font-size: 13px;
      line-height: 1.5;
    }

    header {
      padding: 14px 16px;
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .title {
      font-weight: 700;
      font-size: 14px;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge {
      background: rgba(56, 189, 248, 0.15);
      color: var(--primary);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
    }

    nav.tabs {
      display: flex;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
    }

    .tab-btn {
      flex: 1;
      padding: 8px 10px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
      border-bottom: 2px solid transparent;
    }

    .tab-btn:hover {
      color: var(--text);
    }

    .tab-btn.active {
      color: var(--primary);
      border-bottom: 2px solid var(--primary);
      font-weight: 600;
    }

    .tab-content {
      padding: 14px 16px;
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      color: var(--text-muted);
    }

    input, textarea, select {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-family: inherit;
      margin-bottom: 12px;
      transition: border-color 0.2s;
    }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--primary);
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    button.primary-btn {
      width: 100%;
      padding: 10px;
      background-color: var(--primary);
      color: #0b0f19;
      border: none;
      border-radius: 6px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: background-color 0.2s, transform 0.1s;
    }

    button.primary-btn:hover {
      background-color: var(--primary-hover);
    }

    button.primary-btn:active {
      transform: scale(0.99);
    }

    button.secondary-btn {
      width: 100%;
      padding: 8px;
      background-color: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      margin-top: 6px;
      transition: background-color 0.2s;
    }

    button.secondary-btn:hover {
      background-color: var(--input-bg);
    }

    .status-box {
      margin-top: 12px;
      padding: 10px 12px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.4;
      min-height: 48px;
      word-break: break-word;
    }

    .status-box.success {
      border-color: rgba(16, 185, 129, 0.4);
      color: var(--accent);
    }

    .status-box.error {
      border-color: rgba(239, 68, 68, 0.4);
      color: var(--error);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 8px;
      border-radius: 6px;
      text-align: center;
    }

    .stat-num {
      font-size: 16px;
      font-weight: 700;
      color: var(--primary);
    }

    .stat-label {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .output-card {
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      margin-top: 10px;
      max-height: 180px;
      overflow-y: auto;
      font-size: 12px;
      white-space: pre-wrap;
      color: var(--text);
    }

    .row-flex {
      display: flex;
      gap: 8px;
      align-items: center;
    }
  </style>
</head>
<body>
  <header>
    <div class="title">
      <span>🚀 Gemini Job Co-Pilot</span>
    </div>
    <span class="badge" id="versionBadge">v2.0</span>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="tab-autofill">Autofill</button>
    <button class="tab-btn" data-tab="tab-coverletter">Cover Letter</button>
    <button class="tab-btn" data-tab="tab-settings">Settings</button>
  </nav>

  <!-- TAB 1: AUTOFILL -->
  <main id="tab-autofill" class="tab-content active">
    <div class="stats-grid" id="statsGrid" style="display: none;">
      <div class="stat-card">
        <div class="stat-num" id="statDetected">0</div>
        <div class="stat-label">Detected</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statFilled">0</div>
        <div class="stat-label">Autofilled</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="statSkipped">0</div>
        <div class="stat-label">Manual</div>
      </div>
    </div>

    <button id="fillBtn" class="primary-btn">
      ⚡ Analyze Page & Autofill Form
    </button>

    <div class="status-box" id="autofillStatus">
      Ready. Open any job application (Workday, Greenhouse, Lever, LinkedIn) and click Autofill.
    </div>
  </main>

  <!-- TAB 2: COVER LETTER & SCREENING -->
  <main id="tab-coverletter" class="tab-content">
    <label for="coverLetterTone">Tone / Focus</label>
    <select id="coverLetterTone">
      <option value="firmware">Firmware & Low-Level Embedded Engineering</option>
      <option value="leadership">Technical Lead & Systems Architecture</option>
      <option value="general">High-Impact Engineering & Problem Solver</option>
    </select>

    <button id="genCoverBtn" class="primary-btn">
      📝 Generate Tailored Cover Letter
    </button>

    <div class="output-card" id="coverLetterOutput" style="display: none;"></div>
    <button id="copyCoverBtn" class="secondary-btn" style="display: none;">📋 Copy to Clipboard</button>

    <div class="status-box" id="coverStatus">
      Generates a sharp, role-tailored pitch based on the current page's job description.
    </div>
  </main>

  <!-- TAB 3: SETTINGS & PROFILE -->
  <main id="tab-settings" class="tab-content">
    <label for="apiKey">Gemini API Key</label>
    <div class="row-flex">
      <input type="password" id="apiKey" placeholder="AIzaSy..." style="margin-bottom: 8px;">
      <button id="toggleKeyBtn" class="secondary-btn" style="width: auto; margin-top: 0; margin-bottom: 8px; padding: 7px 10px;">👁️</button>
    </div>

    <label for="modelSelect">Gemini Model</label>
    <select id="modelSelect">
      <option value="gemini-2.0-flash">gemini-2.0-flash (Recommended - Fast & Smart)</option>
      <option value="gemini-1.5-flash">gemini-1.5-flash (Reliable Default)</option>
      <option value="gemini-1.5-pro">gemini-1.5-pro (In-depth Analysis)</option>
    </select>

    <label for="profile">Candidate Profile & Ground Truth</label>
    <textarea id="profile" rows="8" placeholder="Paste your background..."></textarea>

    <button id="saveSettingsBtn" class="primary-btn">
      💾 Save Profile & Settings
    </button>

    <div class="status-box" id="settingsStatus">
      Saved locally in your browser storage.
    </div>
  </main>

  <script src="popup.js"></script>
</body>
</html>
